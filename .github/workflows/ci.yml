name: Praxis CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node tools/scripts/check-marketplace.mjs
      - run: node --test tools/scripts/verify-release-candidate.test.mjs
      # The documentation site (npm run verify) is built by the GitLab pipeline: it syncs praxis-docs.
