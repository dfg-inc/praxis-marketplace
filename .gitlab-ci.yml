# praxis-marketplace: plugin distribution repository. No site is built here (the site lives in praxis-website).
stages:
  - verify

verify:
  stage: verify
  # shared runner 172 (untagged jobs) answers 403 at git fetch since 2026-10-27; runner 171 (tag k8s) works
  tags: [k8s]
  image: node:22-bookworm
  script:
    - node tools/scripts/check-marketplace.mjs
    - node tools/scripts/check-plugin-outputs.mjs
    - node --test tools/scripts/verify-release-candidate.test.mjs
